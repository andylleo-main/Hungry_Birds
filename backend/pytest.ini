[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto

# One event loop for the whole run, for both tests and fixtures.
#
# The app holds two singletons created on first use: the SQLAlchemy engine in
# app/db/session.py and the lru_cache'd Redis client in app/core/redis.py. Both
# bind to whichever loop touched them first, so with a loop per test everything
# after the first one failed with "attached to a different loop" - or, for
# Redis, looked like an unreachable server and skipped. Each test still passed
# when run alone, which is the worst version of this bug.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
