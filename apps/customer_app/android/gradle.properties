org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compiler keeps per-module caches under build/ and
# reopens them on every compile. On Windows those files get held open - by
# Defender's real-time scanning, or by a Gradle worker that has not released
# them - and the build dies with:
#
#   Could not close incremental caches in ...\caches-jvm\jvm\kotlin:
#   class-fq-name-to-source.tab, source-to-classes.tab, internal-name-to-source.tab
#
# It fails in third-party plugin modules (url_launcher, image_picker,
# shared_preferences), not in this app's code, and survives `flutter clean`,
# so it is not stale build state. Turning incremental compilation off removes
# the caches the error is about. Kotlin then recompiles each module in full,
# which costs seconds on a project this size.
#
# Safe to delete once the underlying file locking is dealt with - an exclusion
# for the project folder in Windows Security is the usual cure.
kotlin.incremental=false
