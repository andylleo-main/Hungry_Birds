name: rider_app
description: "Hungry Birds rider app: the deliveries a stall has given you."
publish_to: 'none'

# The number after the + is Android's versionCode, and it must increase for an
# APK to install over one already on a phone. Leave it alone and the update is
# refused with "App not installed" - which reads as a broken build rather than a
# versioning rule, and the only way past it is uninstalling, taking the saved
# login and the printer pairing with it.
version: 1.1.0+2

environment:
  sdk: ^3.9.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  hb_shared:
    path: ../../packages/hb_shared
  provider: ^6.1.2
  # Dials the customer from an order card. A rider standing at the wrong gate
  # needs this more than any other button in the app.
  url_launcher: ^6.3.1
  intl: ^0.19.0
  http: ^1.2.2
  shared_preferences: ^2.3.3
  # A rider on a bike does not watch a screen. The app polls every twelve
  # seconds while it is open, but an assignment has to reach a phone in a
  # pocket, which is what these are for.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
